<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object Remover | SmartTools Hub</title><style>body{font:17px system-ui;background:#080d20;color:white;max-width:950px;margin:30px auto;padding:18px}a{color:#c4b5fd}button{background:#8255e9;color:white;border:0;border-radius:9px;padding:12px;margin:8px}canvas{max-width:100%;height:auto;touch-action:none;cursor:crosshair}</style><a href="index.html#tools">← SmartTools Hub</a><h1>🧽 Free Object Remover</h1><p>Choose an image, paint over a small unwanted spot, then click Remove. This free basic retouching tool blends surrounding colors; it is not generative AI and works best on simple backgrounds.</p><input id="file" type="file" accept="image/*"><p>Brush size <input id="brush" type="range" min="5" max="80" value="25"></p><button id="remove">Remove marked area</button><button id="reset">Reset</button><button id="save">Download PNG</button><p id="status">Choose a photo.</p><canvas id="canvas"></canvas><script>const c=document.querySelector('#canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let original,mask,drawing=false;document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const scale=Math.min(1,1000/im.width,1000/im.height);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,c.width,c.height);original=ctx.getImageData(0,0,c.width,c.height);mask=new Uint8Array(c.width*c.height);URL.revokeObjectURL(u)};im.src=u};function paint(e){if(!drawing||!mask)return;const r=c.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*c.width/r.width),y=Math.round((e.clientY-r.top)*c.height/r.height),rad=+document.querySelector('#brush').value/2;ctx.fillStyle='rgba(255,60,100,.5)';ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();for(let yy=Math.max(0,y-rad|0);yy<Math.min(c.height,y+rad);yy++)for(let xx=Math.max(0,x-rad|0);xx<Math.min(c.width,x+rad);xx++)if((xx-x)**2+(yy-y)**2<rad*rad)mask[yy*c.width+xx]=1}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=paint;c.onpointerup=()=>drawing=false;document.querySelector('#reset').onclick=()=>{if(!original)return;mask.fill(0);ctx.putImageData(original,0,0)};document.querySelector('#remove').onclick=()=>{if(!original)return;const w=c.width,h=c.height,src=original.data,out=new Uint8ClampedArray(src);let changed=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=y*w+x;if(!mask[i])continue;changed++;let sum=[0,0,0,0],n=0;for(let dy=-15;dy<=15;dy+=3)for(let dx=-15;dx<=15;dx+=3){let xx=x+dx,yy=y+dy;if(xx<0||xx>=w||yy<0||yy>=h||mask[yy*w+xx])continue;let j=(yy*w+xx)*4;for(let k=0;k<4;k++)sum[k]+=src[j+k];n++}if(n)for(let k=0;k<4;k++)out[i*4+k]=sum[k]/n}original=new ImageData(out,w,h);mask.fill(0);ctx.putImageData(original,0,0);document.querySelector('#status').textContent=changed?'Retouch applied. Results may vary.':'Mark a small area first.'};document.querySelector('#save').onclick=()=>{if(!original)return;ctx.putImageData(original,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='retouched.png';a.click()};</script></html>
